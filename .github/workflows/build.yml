name: Build IBRA DL
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APKs
        id: build
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            grep -E "error:|e: |FAILURE|What went wrong|Could not|> " build.log | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/IBRA DL ${ver} arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/IBRA DL ${ver} armv7.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ibra-dl-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    name: Test on an Android 15 emulator
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: shots/
      - name: Save screenshots to the ci-shots branch
        if: always()
        run: |
          cd shots
          git init -q -b ci-shots
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "screens ${{ github.sha }}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
      - name: Fail if the app crashed
        run: |
          if [ -s shots/crash.txt ]; then
            head -60 shots/crash.txt | sed 's/^/::error::/'
            exit 1
          fi

  release:
    name: Publish release
    needs: [android, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ibra-dl-android
          path: out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          name: IBRA DL ${{ needs.android.outputs.version }}
          make_latest: true
          files: out/*.apk
          body: |
            **IBRA DL ${{ needs.android.outputs.version }}** — بحث واستماع وتحميل أغاني من يوتيوب، قوائم تشغيل، تشغيل بالخلفية وتكرار الأغنية. بدون إعلانات.

            أي ملف أنزّل؟
            - **arm64** ← أغلب الموبايلات الحديثة (من 2017 وطالع).
            - **armv7** ← الموبايلات القديمة.

            برمجة وتطوير ابراهيم الخزرجي — https://ibraprogram.netlify.app/
